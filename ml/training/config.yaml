# ============================================================
# YOLO11 Training Configuration
# ============================================================
# File ini berisi hyperparameter untuk training model YOLO11
# pada dataset UR Fall Detection (normal, transitional,
# lying_on_ground).
#
# Referensi: https://docs.ultralytics.com/modes/train/
# ============================================================

# ---- Dataset -----------------------------------------------
# Path ke file data.yaml yang mendefinisikan lokasi dataset
# dan daftar kelas.
data: "../data/processed/data.yaml"

# ---- Model -------------------------------------------------
# Base model yang digunakan. Pilihan:
#   yolo11n.pt  (nano   - paling cepat, akurasi rendah)
#   yolo11s.pt  (small  - balance speed & accuracy)
#   yolo11m.pt  (medium - akurasi lebih baik)
#   yolo11l.pt  (large  - akurasi tinggi, lambat)
model: "yolo11n.pt"
 
# ---- Training Hyperparameters ------------------------------
epochs: 70
batch: 16
imgsz: 640
patience: 30        # extended patience untuk memaksimalkan recall
optimizer: "AdamW"  # optimizer AdamW untuk presisi tinggi
lr0: 0.001          # initial learning rate lebih halus
lrf: 0.01           # final learning rate (lr0 * lrf)
cos_lr: true        # cosine learning rate schedule untuk konvergensi halus
cls: 1.0            # bobot loss klasifikasi dinaikkan (ketegasan deteksi kelas)
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3
warmup_momentum: 0.8

# ---- Augmentation (Simulasi Kondisi Nyata Panti Jompo) -----
hsv_h: 0.015        # hue augmentation
hsv_s: 0.7          # saturation augmentation
hsv_v: 0.6          # value/brightness augmentation (simulasi cahaya minim/malam hari)
bgr: 0.2            # grayscale/infrared simulation (20% channel shift)
erasing: 0.4        # random erasing (simulasi occlusion terhalang selimut/kursi)
degrees: 0.0        # rotation (+/- degrees)
translate: 0.1      # translation (+/- fraction)
scale: 0.5          # scale (+/- gain)
flipud: 0.0         # vertical flip dimatikan (menjaga orientasi gravitasi lantai vs langit-langit)
fliplr: 0.5         # horizontal flip (kiri-kanan)
mosaic: 1.0         # mosaic augmentation

# ---- Output ------------------------------------------------
project: "../models"
name: "exp006_hybrid_adamw"
exist_ok: true
save: true
save_period: 10     # save checkpoint setiap N epochs
