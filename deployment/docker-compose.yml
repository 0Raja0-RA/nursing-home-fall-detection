# ============================================================
# FallDetect — Docker Compose
# ============================================================
# Satu service: backend FastAPI yang ikut menyajikan dashboard. Setelah jalan,
# buka http://localhost:8000 (dashboard) dan http://localhost:8000/docs (API).
#
# Persiapan sekali, di folder deployment:
#   1. Salin .env.example menjadi .env, lalu isi DEMO_USERNAME dan DEMO_PASSWORD.
#   2. Siapkan sumber kamera (lihat bagian kamera di .env.example).
# Lalu jalankan:
#   docker compose up --build
# ============================================================

services:
  falldetect:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    image: falldetect:latest
    container_name: falldetect
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Bobot model dari repo. Bila yolo11n-pose.pt tidak ada, Ultralytics
      # mengunduh model pose resmi saat frame pertama.
      - ../ml/models:/app/ml/models:ro
      # Video untuk kamera. Webcam laptop tidak bisa dibuka dari dalam Docker di Windows.
      - ./video:/app/video:ro
      # Database, foto kejadian, dan klip.
      - falldetect-data:/app/data
    restart: unless-stopped
    healthcheck:
      # Image tidak memasang curl, jadi health check memakai Python.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  falldetect-data:
