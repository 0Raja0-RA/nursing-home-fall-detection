kirim,</text><text class="node-label" x="1225.00" y="545.00" font-size="16" fill="#e03131" text-anchor="middle" dominant-baseline="central">hanya sekali</text></g><g data-id="n012" data-kind="node" data-base-op="1.0" class="el node"><rect class="body" x="560.00" y="90.00" width="330.00" height="130.00" rx="32.00" ry="32.00" fill="#f1f3f5" stroke="#1e1e1e" stroke-width="2" /><text class="node-label" x="725.00" y="135.00" font-size="16" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central">UNKNOWN</text><text class="node-label" x="725.00" y="155.00" font-size="16" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central">kamera tidak</text><text class="node-label" x="725.00" y="175.00" font-size="16" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central">mengirim gambar</text></g><g data-id="n017" data-kind="node" data-base-op="1.0" class="el node"><rect class="body" x="10.00" y="880.00" width="1430.00" height="330.00" rx="32.00" ry="32.00" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="14 9"/></g><g data-id="L002" data-kind="static" class="el static"><text class="free-text" x="26.00" y="400.75" font-size="14" fill="#1e1e1e" text-anchor="start" dominant-baseline="central">selama kamera masih mengirim frame</text></g><g data-id="L007" data-kind="static" class="el static"><text class="free-text" x="414.00" y="488.75" font-size="14" fill="#1e1e1e" text-anchor="start" dominant-baseline="central">timer</text><text class="free-text" x="414.00" y="506.25" font-size="14" fill="#1e1e1e" text-anchor="start" dominant-baseline="central">&gt;= 2 detik</text></g><g data-id="L009" data-kind="static" class="el static"><text class="free-text" x="914.00" y="488.75" font-size="14" fill="#1e1e1e" text-anchor="start" dominant-baseline="central">timer</text><text class="free-text" x="914.00" y="506.25" font-size="14" fill="#1e1e1e" text-anchor="start" dominant-baseline="central">&gt;= 10 detik</text></g><g data-id="L014" data-kind="static" class="el static"><text class="free-text" x="914.00" y="158.75" font-size="14" fill="#1e1e1e" text-anchor="start" dominant-baseline="central">kamera OFFLINE — dari state mana pun,</text><text class="free-text" x="914.00" y="176.25" font-size="14" fill="#1e1e1e" text-anchor="start" dominant-baseline="central">timer langsung direset</text></g><g data-id="L016" data-kind="static" class="el static"><text class="free-text" x="-76.00" y="198.75" font-size="14" fill="#1e1e1e" text-anchor="start" dominant-baseline="central">frame masuk lagi →</text><text class="free-text" x="-76.00" y="216.25" font-size="14" fill="#1e1e1e" text-anchor="start" dominant-baseline="central">kembali MONITORING</text></g><g data-id="L018" data-kind="static" class="el static"><text class="free-text" x="36.00" y="917.25" font-size="18" fill="#1e1e1e" text-anchor="start" dominant-baseline="central">APA YANG MENGGERAKKAN TIMER</text></g><g data-id="L019" data-kind="static" class="el static"><text class="free-text" x="36.00" y="963.38" font-size="15" fill="#1e1e1e" text-anchor="start" dominant-baseline="central">maju          postur pemicu terdeteksi dan keyakinannya &gt;= 0,5</text><text class="free-text" x="36.00" y="982.12" font-size="15" fill="#1e1e1e" text-anchor="start" dominant-baseline="central">berhenti      deteksi ragu-ragu — tidak dianggap aman, tapi juga tidak menambah</text><text class="free-text" x="36.00" y="1000.88" font-size="15" fill="#1e1e1e" text-anchor="start" dominant-baseline="central">bertahan      orang hilang dari deteksi — ditahan selama grace period 3 detik,</text><text class="free-text" x="36.00" y="1019.62" font-size="15" fill="#1e1e1e" text-anchor="start" dominant-baseline="central">              karena tertutup selimut atau kursi bukan berarti sudah bangun</text><text class="free-text" x="36.00" y="1038.38" font-size="15" fill="#1e1e1e" text-anchor="start" dominant-baseline="central">direset       postur bukan pemicu selama 5 frame berturut-turut, ATAU orang</text><text class="free-text" x="36.00" y="1057.12" font-size="15" fill="#1e1e1e" text-anchor="start" dominant-baseline="central">              hilang lebih lama dari grace period</text></g><g data-id="L020" data-kind="static" class="el static"><text class="free-text" x="36.00" y="1138.75" font-size="14" fill="#1e1e1e" text-anchor="start" dominant-baseline="central">Jeda yang tidak terpantau dibatasi 1 detik per pembaruan: pipeline yang sempat</text><text class="free-text" x="36.00" y="1156.25" font-size="14" fill="#1e1e1e" text-anchor="start" dominant-baseline="central">tersendat tidak boleh dihitung sebagai waktu tergeletak.</text></g></g></svg>